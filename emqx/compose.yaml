name: quic1
services:
  emqx:
    image: emqx/emqx:5.8.8
    container_name: quic1-emqx
    hostname: quic1-broker
    network_mode: host
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
    volumes:
      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./certs:/opt/emqx/etc/quic1-certs:ro
    healthcheck:
      test: [CMD, /opt/emqx/bin/emqx, ctl, status]
      interval: 5s
      timeout: 5s
      retries: 30
    stop_grace_period: 20s
