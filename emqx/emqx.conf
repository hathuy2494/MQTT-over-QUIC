# Linux machine B, dedicated lab only. Same broker for all three transports.
node {
  name = "emqx@127.0.0.1"
  cookie = "quic1-lab-only-cookie"
  data_dir = "/opt/emqx/data"
}
listeners.tcp.default {
  enable = true
  bind = "0.0.0.0:1883"
}
listeners.ssl.default {
  enable = true
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/quic1-certs/ca.crt"
    certfile = "/opt/emqx/etc/quic1-certs/server.crt"
    keyfile = "/opt/emqx/etc/quic1-certs/server.key"
    versions = ["tlsv1.3"]
    ciphers = ["TLS_AES_128_GCM_SHA256"]
    verify = verify_none
    reuse_sessions = false
  }
}
listeners.quic.default {
  enable = true
  bind = "0.0.0.0:14567"
  ciphers = ["TLS_AES_128_GCM_SHA256"]
  idle_timeout_ms = 45000
  handshake_idle_timeout_ms = 10000
  server_resumption_level = 0
  ssl_options {
    cacertfile = "/opt/emqx/etc/quic1-certs/ca.crt"
    certfile = "/opt/emqx/etc/quic1-certs/server.crt"
    keyfile = "/opt/emqx/etc/quic1-certs/server.key"
    verify = verify_none
  }
}
listeners.ws.default.enable = false
listeners.wss.default.enable = false
authentication = []
authorization {
  no_match = allow
  sources = []
}
dashboard.listeners.http.bind = "127.0.0.1:18083"
log.console.enable = true
